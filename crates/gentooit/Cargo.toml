[package]
name = "gentooit"
version = "0.1.0"
edition = "2021"
description = "gentooit - packit-like automation for Gentoo Linux (CLI)"
license = "MIT"

[[bin]]
name = "gentooit"
path = "src/main.rs"

[dependencies]
gentooit-core = { path = "../gentooit-core" }
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
