[package]
name = "gentooit-core"
version = "0.1.0"
edition = "2021"
description = "Core library for gentooit - packit-like automation for Gentoo Linux"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
whirlpool = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
git2 = "0.21"
octocrab = "0.54"
jsonwebtoken = "10"
clap = { version = "4.6", features = ["derive", "env"] }
quick-xml = "0.41"
secrecy = { workspace = true }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
